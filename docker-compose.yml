version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: floorcraft_db
    env_file:
      - ./.env
    volumes:
      # Maps PostgreSQL data directly to your local volumes/pgdata/ folder
      - ./volumes/pgdata:/var/lib/postgresql/data
    networks:
      - floorcraft_network
    ports:
      - "5532:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floorcraft_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      # Maps Django uploaded user assets (like custom desk icons) to volumes/media/
      - ./volumes/media:/app/media
    env_file:
      - ./.env
    depends_on:
      - postgres
    networks:
      - floorcraft_network

  frontend:
    build:
      context: ./frontend_ts
      dockerfile: Dockerfile
    container_name: floorcraft_frontend
    volumes:
      - ./frontend_ts:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      - backend
    networks:
      - floorcraft_network

  nginx:
    image: nginx:alpine
    container_name: floorcraft_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - floorcraft_network

# NOTE: You can now completely REMOVE the top-level 'volumes:' block
# at the bottom of the file since we are using direct local host paths!

networks:
  floorcraft_network:
    driver: bridge
