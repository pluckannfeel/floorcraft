events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Frontend Routing (Updated for Vite on port 5173)
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Variant uploads (object-visuals U3): the ONLY route whose bodies
        # may exceed nginx's 1 MB default. Exact match = the collection
        # route the upload POST hits; detail routes (DELETE, /file/ GET)
        # carry no bodies and stay under the general /api/ block below.
        # 12m = the 5 MB serializer cap plus generous multipart-framing
        # headroom, so users hit the serializer's friendly size message,
        # never a raw nginx 413 page. Locations do NOT inherit proxy_pass
        # or proxy_set_header, so the general /api/ block's directives are
        # re-declared verbatim (dropping X-Forwarded-Proto here would break
        # cookie security for this route).
        location = /api/object-variants/ {
            client_max_body_size 12m;
            proxy_pass http://backend:8000/api/object-variants/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Backend API Routing
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin Site Routing
        location /admin/ {
            proxy_pass http://backend:8000/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Static Files (admin CSS/JS, served by runserver in DEBUG mode)
        location /static/ {
            proxy_pass http://backend:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
